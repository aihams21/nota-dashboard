<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NO-TA · لوحة المتابعة</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0B1020;color:#F6F4FF;min-height:100vh;direction:rtl}
  .bg-orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0}
  .orb1{width:340px;height:340px;background:rgba(114,87,255,0.18);top:-100px;right:-80px}
  .orb2{width:280px;height:280px;background:rgba(56,217,197,0.12);bottom:10%;left:-60px}
  .orb3{width:200px;height:200px;background:rgba(255,95,143,0.10);bottom:-40px;right:20%}
  .wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:24px 16px 60px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .brand{font-size:28px;font-weight:900;letter-spacing:-1px}
  .brand span{color:#38D9C5}
  .status-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(23,33,58,0.8);border:1px solid rgba(246,244,255,0.12);border-radius:99px;padding:6px 14px;font-size:12px;font-weight:700;color:#9CA8C7}
  .status-pill .dot{width:8px;height:8px;border-radius:50%}
  .dot-on{background:#38D9C5;box-shadow:0 0 8px rgba(56,217,197,0.6)}
  .dot-off{background:#FF5F8F;box-shadow:0 0 8px rgba(255,95,143,0.5)}
  /* Tabs */
  .tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
  .tab{flex:1;min-width:90px;text-align:center;padding:10px;border-radius:14px;background:rgba(23,33,58,0.6);border:1px solid rgba(246,244,255,0.08);color:#9CA8C7;font-weight:800;font-size:13px;cursor:pointer;transition:.2s}
  .tab.active{background:rgba(56,217,197,0.16);border-color:rgba(56,217,197,0.4);color:#38D9C5}
  .tab:hover{color:#F6F4FF}
  /* Device selector */
  .picker{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
  .chip{padding:7px 14px;border-radius:99px;background:rgba(23,33,58,0.7);border:1px solid rgba(246,244,255,0.10);color:#9CA8C7;font-size:12px;font-weight:800;cursor:pointer;transition:.2s}
  .chip.active{background:rgba(114,87,255,0.2);border-color:rgba(114,87,255,0.5);color:#F6F4FF}
  .chip .cnt{opacity:.6;margin-inline-start:4px}
  .summary{display:flex;gap:12px;margin-bottom:24px}
  .stat{flex:1;background:rgba(23,33,58,0.7);border:1px solid rgba(246,244,255,0.10);border-radius:18px;padding:16px;text-align:center}
  .stat-num{font-size:32px;font-weight:900;color:#38D9C5}
  .stat-label{font-size:11px;color:#9CA8C7;margin-top:4px;font-weight:700}
  .cards{display:flex;flex-direction:column;gap:12px}
  .card{background:rgba(23,33,58,0.75);border:1px solid rgba(246,244,255,0.10);border-radius:20px;padding:18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:border-color .3s, transform .1s}
  .card:hover{transform:translateY(-1px)}
  .card.online{border-color:rgba(56,217,197,0.35)}
  .card.offline{border-color:rgba(255,95,143,0.25);opacity:0.75}
  .card.selected{outline:2px solid rgba(114,87,255,0.6)}
  .card-icon{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
  .card.online .card-icon{background:rgba(56,217,197,0.15)}
  .card.offline .card-icon{background:rgba(255,95,143,0.12)}
  .card-info{flex:1;min-width:0}
  .card-name{font-size:15px;font-weight:900;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-meta{font-size:11px;color:#9CA8C7;font-weight:600}
  .card-status{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0}
  .card-status .dot{width:12px;height:12px;border-radius:50%}
  .card-status span{font-size:10px;font-weight:800}
  .card.online .card-status span{color:#38D9C5}
  .card.offline .card-status span{color:#FF5F8F}
  .empty{text-align:center;padding:50px 20px;color:#9CA8C7}
  .empty .icon{font-size:44px;margin-bottom:10px}
  .empty h3{color:#F6F4FF;font-size:17px;font-weight:900;margin-bottom:6px}
  /* Photo grid */
  .photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .photo{aspect-ratio:1;border-radius:14px;overflow:hidden;background:rgba(23,33,58,0.6);border:1px solid rgba(246,244,255,0.08);cursor:zoom-in}
  .photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
  .photo:hover img{transform:scale(1.06)}
  /* Contacts */
  .contact{display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(23,33,58,0.6);border:1px solid rgba(246,244,255,0.07);border-radius:14px;margin-bottom:8px}
  .contact-avatar{width:40px;height:40px;border-radius:50%;background:rgba(114,87,255,0.25);display:flex;align-items:center;justify-content:center;font-weight:900;color:#B9A8FF;flex-shrink:0}
  .contact-name{font-weight:800;font-size:14px}
  .contact-phone{font-size:11px;color:#9CA8C7;font-weight:600;direction:ltr;text-align:right;margin-top:2px}
  /* Files */
  .file{display:flex;align-items:center;gap:12px;padding:13px 14px;background:rgba(23,33,58,0.6);border:1px solid rgba(246,244,255,0.07);border-radius:14px;margin-bottom:8px}
  .file-icon{width:40px;height:40px;border-radius:12px;background:rgba(56,217,197,0.14);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .file-name{font-weight:800;font-size:13px;word-break:break-all;direction:ltr;text-align:right}
  .file-size{font-size:11px;color:#9CA8C7;font-weight:600;margin-top:2px}
  .file a{margin-inline-start:auto;color:#38D9C5;font-weight:800;font-size:12px;text-decoration:none;flex-shrink:0}
  .file a:hover{text-decoration:underline}
  .refresh-info{text-align:center;color:#9CA8C7;font-size:10px;margin-top:18px;font-weight:600}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .pulse{animation:pulse 2s ease-in-out infinite}
  /* Lightbox */
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:50;display:none;align-items:center;justify-content:center;cursor:zoom-out;padding:20px}
  .lightbox img{max-width:100%;max-height:100%;border-radius:10px}
  /* Login gate */
  .login-gate{position:fixed;inset:0;background:rgba(11,16,32,0.97);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
  .login-box{background:rgba(23,33,58,0.9);border:1px solid rgba(114,87,255,0.35);border-radius:22px;padding:30px 26px;width:100%;max-width:340px;text-align:center}
  .login-box .lock{font-size:40px;margin-bottom:12px}
  .login-box h2{font-size:18px;font-weight:900;margin-bottom:6px}
  .login-box p{font-size:12px;color:#9CA8C7;font-weight:600;margin-bottom:18px}
  .login-box input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(246,244,255,0.15);background:rgba(11,16,32,0.8);color:#F6F4FF;font-size:15px;text-align:center;outline:none;direction:ltr}
  .login-box input:focus{border-color:rgba(114,87,255,0.6)}
  .login-box button{width:100%;margin-top:12px;padding:13px;border-radius:12px;border:none;background:linear-gradient(135deg,#38D9C5,#2E7CF6);color:#081018;font-weight:900;font-size:15px;cursor:pointer}
  .login-box .err{color:#FF5F8F;font-size:12px;font-weight:700;margin-top:10px;min-height:16px}
</style>
</head>
<body>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>
<div class="bg-orb orb3"></div>
<div class="wrap">
  <div class="top">
    <div class="brand">NO-TA<span>.</span></div>
    <div class="status-pill"><div class="dot dot-on pulse"></div>لوحة المتابعة</div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="devices">📱 الأجهزة</div>
    <div class="tab" data-tab="photos">📸 الصور</div>
    <div class="tab" data-tab="contacts">📇 جهات الاتصال</div>
    <div class="tab" data-tab="files">📁 الملفات</div>
  </div>

  <div class="picker" id="picker" hidden></div>
  <div class="summary" id="summary"></div>
  <div id="content"></div>
  <div class="refresh-info">تحديث تلقائي كل 5 ثوانٍ</div>
</div>
<div class="lightbox" id="lightbox" onclick="this.style.display='none'"><img id="lightboxImg" src="" alt=""></div>

<div class="login-gate" id="loginGate">
  <div class="login-box">
    <div class="lock">🔒</div>
    <h2>الصور والجهات محمية</h2>
    <p>أدخل كلمة السر لفتح الصور وجهات الاتصال والملفات</p>
    <input type="password" id="passInput" placeholder="كلمة السر" autocomplete="current-password">
    <button onclick="doLogin()">دخول</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
const OS_ICONS = {android:'📱',ios:'🍎',web:'🌐',windows:'💻',macos:'🖥️',linux:'🐧',unknown:'📡'};
// Works from github.io (absolute via NOTA_SERVER) and from the local server (relative).
const base = (window.NOTA_SERVER || '').replace(/\/$/,'');
const API = (p) => base + p;

let devices = [];
let selectedId = localStorage.getItem('nota:device') || null;
let activeTab = 'devices';
let token = sessionStorage.getItem('nota:token') || null;
let authEnabled = false;

function authHeaders(){
  return token ? {'Authorization':'Bearer '+token} : {};
}
// Append token as query param for <img> and download links (no header support).
function authUrl(u){
  if(!token) return u;
  return u + (u.indexOf('?')>=0?'&':'?') + 'token=' + encodeURIComponent(token);
}
function ensureAuth(){
  if(!authEnabled) return true;
  if(token) return true;
  document.getElementById('loginGate').style.display='flex';
  setTimeout(()=>{ const i=document.getElementById('passInput'); i && i.focus(); },50);
  return false;
}
window.doLogin=async function(){
  const p=document.getElementById('passInput').value;
  const err=document.getElementById('loginErr');
  err.textContent='';
  try{
    const r=await fetch(API('/api/auth/login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});
    const d=await r.json();
    if(!r.ok){ err.textContent='كلمة السر غلط'; return; }
    token=d.token; sessionStorage.setItem('nota:token',token);
    document.getElementById('loginGate').style.display='none';
    document.getElementById('passInput').value='';
    renderTab();
  }catch(e){ err.textContent='تعذّر الاتصال بالخادم'; }
};
document.getElementById('passInput').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });

function timeAgo(ts){
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'الآن';
  if(s<3600) return Math.floor(s/60)+' دقيقة';
  if(s<86400) return Math.floor(s/3600)+' ساعة';
  return Math.floor(s/86400)+' يوم';
}
function fmtSize(n){
  if(n<1024) return n+' B';
  if(n<1048576) return (n/1024).toFixed(1)+' KB';
  return (n/1048576).toFixed(1)+' MB';
}
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}

async function refresh(){
  try{
    const res=await fetch(API('/api/devices'));
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    devices=data.devices||[];
    renderAll();
  }catch(e){
    document.getElementById('summary').innerHTML='<div class="empty"><div class="icon">⚠️</div><h3>الخادم غير متاح</h3><p>شغّل اللابتوب والخادم ثم حدّث هذه الصفحة.</p></div>';
    document.getElementById('content').innerHTML='';
  }
}

function renderAll(){
  // Summary
  const online=devices.filter(d=>d.online).length;
  const offline=devices.length-online;
  document.getElementById('summary').innerHTML=
    '<div class="stat"><div class="stat-num">'+devices.length+'</div><div class="stat-label">إجمالي الأجهزة</div></div>'+
    '<div class="stat"><div class="stat-num" style="color:#38D9C5">'+online+'</div><div class="stat-label">متصل</div></div>'+
    '<div class="stat"><div class="stat-num" style="color:#FF5F8F">'+offline+'</div><div class="stat-label">فاصل</div></div>';

  if(!devices.length){
    document.getElementById('picker').hidden=true;
    document.getElementById('content').innerHTML='<div class="empty"><div class="icon">📱</div><h3>لا توجد أجهزة بعد</h3><p>افتح تطبيق NO-TA على جهازك وسيظهر هنا تلقائياً.</p></div>';
    return;
  }
  if(!selectedId || !devices.find(d=>d.id===selectedId)) selectedId=devices[0].id;
  localStorage.setItem('nota:device', selectedId);

  renderPicker();
  renderTab();
}

function renderPicker(){
  const pick=document.getElementById('picker');
  pick.hidden=false;
  pick.innerHTML='<span style="color:#9CA8C7;font-size:12px;font-weight:800;align-self:center">الجهاز:</span>'+
    devices.map(d=>'<div class="chip '+(d.id===selectedId?'active':'')+'" onclick="selectDevice(\''+d.id+'\')">'+esc(d.name)+'<span class="cnt">'+(d.online?'●':'○')+'</span></div>').join('');
}

function selectDevice(id){ selectedId=id; localStorage.setItem('nota:device',id); renderPicker(); renderTab(); }
window.selectDevice=selectDevice;

function renderTab(){
  const c=document.getElementById('content');
  const d=devices.find(x=>x.id===selectedId);
  if(!d){ c.innerHTML=''; return; }
  if(activeTab==='devices') renderDevices();
  else if(activeTab==='photos') renderPhotos();
  else if(activeTab==='contacts') renderContacts();
  else if(activeTab==='files') renderFiles();
}

function renderDevices(){
  const c=document.getElementById('content');
  if(!devices.length){
    c.innerHTML='<div class="empty"><div class="icon">📱</div><h3>لا توجد أجهزة بعد</h3><p>افتح تطبيق NO-TA على جهازك وسيظهر هنا تلقائياً.</p></div>';
    return;
  }
  c.innerHTML='<div class="cards">'+devices.map(d=>{
    const icon=OS_ICONS[d.os]||OS_ICONS.unknown;
    const cls=d.online?'online':'offline';
    const sel=d.id===selectedId?' selected':'';
    const statusText=d.online?'متصل':'النت فاصل';
    return '<div class="card '+cls+sel+'" onclick="selectDevice(\''+d.id+'\')">'+
      '<div class="card-icon">'+icon+'</div>'+
      '<div class="card-info">'+
        '<div class="card-name">'+esc(d.name)+'</div>'+
        '<div class="card-meta">'+esc(d.model)+' · '+esc(d.os)+'</div>'+
        '<div class="card-meta">آخر ظهور: '+timeAgo(d.lastSeen)+'</div>'+
      '</div>'+
      '<div class="card-status"><div class="dot '+(d.online?'dot-on':'dot-off')+'"></div><span>'+statusText+'</span></div>'+
    '</div>';
  }).join('')+'</div>';
}

async function renderPhotos(){
  const c=document.getElementById('content');
  if(!ensureAuth()){ c.innerHTML='<div class="empty"><div class="icon">🔒</div><h3>محمي بكلمة سر</h3><p>أدخل كلمة السر بالأعلى لفتح الصور.</p></div>'; return; }
  c.innerHTML='<div class="empty"><div class="icon">📸</div><h3>جارٍ تحميل الصور…</h3></div>';
  try{
    const res=await fetch(API('/api/media/'+selectedId+'/photos'),{headers:authHeaders()});
    const data=await res.json();
    const files=data.files||[];
    if(!files.length){
      c.innerHTML='<div class="empty"><div class="icon">📸</div><h3>لا توجد صور بعد</h3><p>افتح تطبيق NO-TA على الجهاز واسمح بصلاحية الصور.</p></div>';
      return;
    }
    c.innerHTML='<div class="photos">'+files.map(f=>{
      const u=authUrl(API('/api/media/'+selectedId+'/photos/'+f.name));
      return '<div class="photo" onclick="openLightbox(\''+u+'\')"><img loading="lazy" src="'+u+'" alt=""></div>';
    }).join('')+'</div>';
  }catch(e){
    c.innerHTML='<div class="empty"><div class="icon">⚠️</div><h3>تعذّر تحميل الصور</h3></div>';
  }
}

async function renderContacts(){
  const c=document.getElementById('content');
  if(!ensureAuth()){ c.innerHTML='<div class="empty"><div class="icon">🔒</div><h3>محمي بكلمة سر</h3><p>أدخل كلمة السر بالأعلى لفتح جهات الاتصال.</p></div>'; return; }
  c.innerHTML='<div class="empty"><div class="icon">📇</div><h3>جارٍ تحميل جهات الاتصال…</h3></div>';
  try{
    const res=await fetch(API('/api/media/'+selectedId+'/contacts'),{headers:authHeaders()});
    const data=await res.json();
    const list=data.contacts||[];
    if(!list.length){
      c.innerHTML='<div class="empty"><div class="icon">📇</div><h3>لا توجد جهات اتصال</h3><p>افتح تطبيق NO-TA على الجهاز واسمح بصلاحية جهات الاتصال.</p></div>';
      return;
    }
    c.innerHTML=list.map(ct=>{
      const initial=esc((ct.name||'؟').trim().charAt(0));
      const phones=(ct.phones||[]).join(' · ');
      return '<div class="contact">'+
        '<div class="contact-avatar">'+initial+'</div>'+
        '<div><div class="contact-name">'+esc(ct.name||'بدون اسم')+'</div>'+
        (phones?'<div class="contact-phone">'+esc(phones)+'</div>':'')+
        (ct.company?'<div class="contact-phone">'+esc(ct.company)+'</div>':'')+
        '</div></div>';
    }).join('');
  }catch(e){
    c.innerHTML='<div class="empty"><div class="icon">⚠️</div><h3>تعذّر تحميل جهات الاتصال</h3></div>';
  }
}

async function renderFiles(){
  const c=document.getElementById('content');
  if(!ensureAuth()){ c.innerHTML='<div class="empty"><div class="icon">🔒</div><h3>محمي بكلمة سر</h3><p>أدخل كلمة السر بالأعلى لفتح الملفات.</p></div>'; return; }
  c.innerHTML='<div class="empty"><div class="icon">📁</div><h3>جارٍ تحميل الملفات…</h3></div>';
  try{
    const res=await fetch(API('/api/media/'+selectedId+'/files'),{headers:authHeaders()});
    const data=await res.json();
    const files=data.files||[];
    if(!files.length){
      c.innerHTML='<div class="empty"><div class="icon">📁</div><h3>لا توجد ملفات بعد</h3><p>ملاحظات التطبيق ستظهر هنا.</p></div>';
      return;
    }
    c.innerHTML=files.map(f=>{
      const icon=f.name.endsWith('.json')?'🗒️':f.name.endsWith('.pdf')?'📕':f.name.endsWith('.txt')?'📄':'📎';
      return '<div class="file">'+
        '<div class="file-icon">'+icon+'</div>'+
        '<div><div class="file-name">'+esc(f.name)+'</div><div class="file-size">'+fmtSize(f.size)+'</div></div>'+
        '<a href="'+authUrl(API('/api/media/'+selectedId+'/files/'+f.name))+'" target="_blank" rel="noopener">تحميل</a>'+
        '</div>';
    }).join('');
  }catch(e){
    c.innerHTML='<div class="empty"><div class="icon">⚠️</div><h3>تعذّر تحميل الملفات</h3></div>';
  }
}

function openLightbox(src){ document.getElementById('lightboxImg').src=src; document.getElementById('lightbox').style.display='flex'; }
window.openLightbox=openLightbox;

// Tab switching
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    activeTab=t.dataset.tab;
    renderTab();
  });
});

// Determine whether the server has a password configured.
fetch(API('/api/auth/status')).then(r=>r.json()).then(d=>{
  authEnabled=!!d.enabled;
}).catch(()=>{ authEnabled=false; });

refresh();
setInterval(refresh,5000);
</script>
</body>
</html>
